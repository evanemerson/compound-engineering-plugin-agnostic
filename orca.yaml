# Orca worktree config. Orca applies this file, and .worktreeinclude, only to
# worktrees Orca creates; a lane made with plain `git worktree add` gets
# neither the tabs nor the copied files.
# This repo needs no setup: its tests are bash and Python-stdlib scripts,
# CI installs nothing, and there is no Docker stack.
# orca.yaml has no agent-tab type: "Agent" is a plain terminal with that title.
defaultTabs:
  - title: Agent
    color: "#7c3aed"
  - title: Git status
    color: "#16a34a"
    command: git status --short --branch
