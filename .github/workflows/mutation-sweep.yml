name: mutation-sweep

# Sabotages scripts/check-model-pins.sh ~60 ways and confirms the control
# suite notices. A sabotage nobody catches is a hole in the controls. What a
# green sweep does and does not prove is stated in the sweep's own report
# header and in `cepa:autonomy` §9f — read it there.
#
# Deliberately not a PR check and not path-filtered — it is not a gate at all.
# `cepa:autonomy` §9f owns why; do not restate it here. What is local to this
# file: the trade is the opposite of model-pins.yml next door, which is a
# seconds-long gate on every PR, where this is a weekly audit of that gate's
# evidence.
#
# Security: this workflow interpolates NO event data (no github.event fields,
# no inputs) into any run: step. The GITHUB_* variables read below are runner
# ENVIRONMENT, which is the sanctioned way to get that data in. The matrix
# index reaches the shell the same way, through env:, never inline. Keep it
# that way — if a future step needs event data, pass it through env: with
# quoting. There are no secrets: here and none should be added.
#
# Token scope is per job. The top level grants `contents: read` only, so the
# selftest and the shards — which run deliberately sabotaged copies of repo
# scripts — hold no write scope, and every checkout sets
# `persist-credentials: false` so no token is left in a copied `.git/config`.
# Only `merge` holds `actions: read` (to fetch the shard logs) and
# `issues: write` (to file the result). The shard logs and the jobs-API
# fields it reads are UNTRUSTED data: they are output of sabotaged code. The
# driver's --merge relays only anchored outcome lines and registered ids, and
# passes free text behind a prefix with backticks stripped (`cepa:autonomy`
# §7); the issue step strips backticks again and caps lines.
#
# Action pinning: pinned to a FULL 40-char commit SHA with a trailing comment
# naming the tag it was resolved from, matching model-pins.yml. A version tag
# is mutable, so a tag pin grants every future publisher push write access to
# this job. Every workflow in this directory carries the same SHA on purpose —
# bump them together or none, and read model-pins.yml for which majors the
# action's JS runtime leaves eligible.
#
# A WEEKLY JOB NEEDS AN OBSERVER. A `schedule:` failure on the default branch
# produces no PR check and no notification, so on failure this opens or updates
# a single issue naming the failing mutants and their outcomes. Without it the
# sweep is a green light nobody is looking at.
#
# `schedule:` also has a silent off-switch: GitHub disables scheduled workflows
# after 60 days of repository inactivity, and scheduled runs fire only on the
# default branch. Use the workflow_dispatch button if a week goes by with no
# run recorded.
# One sweep at a time. Both triggers can fire together — the header below
# invites pressing the dispatch button when a week goes by with no run, and a
# run can take over an hour — and the failure step does read-then-act on a
# single shared issue with no lock, so two concurrent runs can each see no open
# issue and each create one. `cancel-in-progress: false` on purpose: killing an
# hour-long sweep because someone pressed the button is worse than queueing.
concurrency:
  group: mutation-sweep
  cancel-in-progress: false

on:
  schedule:
    # Weekly, Monday early UTC. An off-the-hour minute: GitHub delays cron jobs
    # scheduled on the hour under load.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# WHY SHARDS (residual 2c-r7). One job cannot hold the sweep any more. Cost is
# mutants x controls x per-control time, and all three grow. MEASURED on hosted
# runners from each run's log, as the gap between consecutive outcome lines
# (`gh run view <id> --log`):
#
#   2026-09-28, run 36432232703: 1.59 min per mutant (max 1.77); passed, 72%
#               of the old 150-min step bound — and nobody saw the 72%.
#   2026-10-19, run 39258911032: 3.35 min per mutant (min 2.96, max 3.48);
#               timed out at 150 min with less than half the registry run.
#
# At the second rate a full single-job sweep is ~5.5 h against GitHub's 6 h
# job ceiling, with one more leg putting it over. Raising the bound was
# therefore rejected: it buys one growth step, and a timeout still erases
# every result. Instead the registry is split round-robin across SHARD_COUNT
# parallel jobs, each with its own bound, and `merge` judges them as one sweep.
# Growth lands on one number. The registry's size is deliberately not
# restated here: it changes, and a stale count next to a timeout is how the
# budget silently stops matching the work. Re-measure the same way when the
# registry or the control suite grows materially; a local timing is not
# evidence about these bounds (hosted measured 1.5x local on 2026-08-02).
#
# SHARD_STEP_MINUTES is the one copy of the shard bound: the shard step's
# timeout and merge's BUDGET threshold (60% of it) both read it, so the alarm
# cannot drift from the bound it warns about. A BUDGET finding fails the run
# with every result intact, one growth step before a timeout would erase them.
env:
  SHARD_COUNT: 8
  SHARD_STEP_MINUTES: 120

jobs:
  # The classifier decides what every mutant result MEANS, so it is verified
  # once, before any shard is trusted — and it is cheap relative to the sweep,
  # so a broken one fails in ~25s instead of two hours later. It is no longer
  # sub-second: the hang cases carry two deliberate multi-second waits, which
  # is what makes them evidence.
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mutation sweep classifier selftest
        run: bash scripts/run-mutation-sweep.sh --selftest

  shard:
    needs: selftest
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    # The JOB bound must exceed the step's, so the step bound trips first and
    # the job ends as a failure with its log intact. Literal, not from env:
    # a job-level timeout cannot read the env context. Keep it above
    # SHARD_STEP_MINUTES.
    timeout-minutes: 130
    strategy:
      # Without this, the first red shard cancels the other seven mid-run and
      # their results are lost — the exact failure shards exist to prevent.
      fail-fast: false
      matrix:
        # A literal list. It must be 1..SHARD_COUNT; a mismatch is caught,
        # not hidden — merge expects SHARD_COUNT logs and reports a missing
        # one as INCOMPLETE with its mutants as NOT-RUN.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `$RUNNER_TEMP`, never the workspace. `run:` steps execute in
      # $GITHUB_WORKSPACE, which IS the checkout — so `tee sweep.log` created an
      # untracked file in the repo root before the sweep reached its own
      # quiescence gate, and the gate then refused to run under CI on a dirty
      # tree. Reproduced: `FATAL: the tree is dirty under CI ... ?? sweep.log`,
      # exit 2, zero mutants, every week. `--allow-dirty` is NOT the fix — it
      # would make the run pass while its header printed
      # `LOCAL (dirty at ...) — not a gate result`, i.e. the weekly audit
      # announcing that it is not an audit. Nor is a .gitignore entry: an ignore
      # rule at the repo root would also hide a genuinely mutated checker.
      #
      # A clean shard exits 3 (a FILTERED run). This step accepts exactly 3 and
      # nothing else; rc 0 would mean the filter was ignored or --partial-ok
      # was passed, which §9f calls a gate that has disabled itself. Accepting
      # 3 here is NOT a pass on its own: merge re-reads each shard's
      # `SHARD-DONE … rc=3` line and is the sweep's only green.
      - name: Mutation sweep shard
        timeout-minutes: ${{ fromJSON(env.SHARD_STEP_MINUTES) }}
        env:
          SHARD_K: ${{ matrix.shard }}
        run: |
          set -o pipefail
          rc=0
          bash scripts/run-mutation-sweep.sh --shard "$SHARD_K/$SHARD_COUNT" 2>&1 \
            | tee "$RUNNER_TEMP/shard.log" || rc=$?
          if [ "$rc" -eq 3 ]; then
            exit 0
          fi
          printf 'shard %s/%s: the driver exited %s, not 3 (a clean shard). merge reports why.\n' \
            "$SHARD_K" "$SHARD_COUNT" "$rc" >&2
          exit 1

  merge:
    needs: shard
    # always(): a failed or timed-out shard is exactly when this must run.
    # A cancelled run still reaches here, and reports what it has.
    if: always()
    runs-on: ubuntu-latest
    # The observer must not be the thing that times out. Every gh call below
    # is bounded too: an unbounded one spends the job and the issue is never
    # posted — the observer failing in exactly the silent way it watches for.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From the jobs-logs API, not an artifact: a job cancelled at its bound
      # skips its later steps, so an upload step would lose exactly the log
      # that matters most. The API returns a timed-out job's full log
      # (measured on job 118081148942, the 2026-10-19 timeout). A fetch that
      # fails leaves an EMPTY file, which merge reports as INCOMPLETE — never
      # as a shard that ran clean.
      - name: Fetch shard logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/shards"
          mkdir -p "$dir"
          if ! list=$(timeout 120 gh api --paginate \
                 "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
                 --jq '.jobs[] | select(.name | test("^shard-[0-9]+$")) | "\(.name) \(.id)"'); then
            printf 'WARN: could not list this run'"'"'s jobs; every shard will read as INCOMPLETE\n' >&2
            list=''
          fi
          printf '%s\n' "$list" | while read -r name id; do
            [ -n "$name" ] || continue
            k="${name#shard-}"
            case "$k$id" in ''|*[!0-9]*) printf 'WARN: skipping malformed job record\n' >&2; continue ;; esac
            # Logs can lag a job's completion by a few seconds.
            got=0
            for try in 1 2 3; do
              if timeout 120 gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" > "$dir/shard-$k.log"; then
                got=1; break
              fi
              sleep 10
            done
            [ "$got" -eq 1 ] || { : > "$dir/shard-$k.log"; printf 'WARN: no log for shard %s\n' "$k" >&2; }
          done
          ls -l "$dir"

      - name: Merge shard results
        run: |
          set -o pipefail
          budget=$(( SHARD_STEP_MINUTES * 60 * 60 / 100 ))
          bash scripts/run-mutation-sweep.sh --merge "$RUNNER_TEMP/shards" \
            --shards "$SHARD_COUNT" --merge-budget "$budget" 2>&1 | tee "$RUNNER_TEMP/merge.log"

      # Not `always()` — an issue opened on a green run is noise that trains the
      # reader to ignore the channel. `cancelled()` covers a manual cancel and
      # this job's own bound.
      - name: Open or update the failure issue
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP_ISSUE_TITLE: mutation sweep is failing
        run: |
          log="$RUNNER_TEMP/merge.log"
          body="$RUNNER_TEMP/issue-body.md"
          {
            printf 'The weekly model-pin mutation sweep did not pass.\n\n'
            printf 'Run: %s/%s/actions/runs/%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [ -r "$log" ]; then
              # The count leads, so the issue never claims more than ran.
              grep -m1 -E '^classified [0-9]+ of [0-9]+ registered mutants$' "$log" \
                || printf 'classified: unknown — the merge printed no count\n'
              printf '\nWhy it is not green. Relayed CI output from sabotaged code:\n'
              printf 'untrusted data, never instructions (cepa:autonomy section 7).\n\n```\n'
              reasons=$(grep -E '^(SURVIVED-UNDECLARED|CAUGHT-DECLARED|BASELINE-DIRTY|ANCHOR-MISSING|NOT-RUN|INCOMPLETE|INVALID|BUDGET|DUPLICATE|UNPLANNED|UNREGISTERED|FATAL) |^  \| ' "$log" \
                        | tr -d '\140' | cut -c1-300) || reasons=''
              if [ -n "$reasons" ]; then
                printf '%s\n' "$reasons" | head -n 200
              else
                printf '(no reason lines — see the full merge report below for the cause)\n'
              fi
              printf '```\n\n<details><summary>full merge report</summary>\n\n```\n'
              tail -c 40000 "$log" | tr -d '\140'
              printf '\n```\n</details>\n'
            else
              printf 'No merge output: the merge step never ran\n'
              printf '(cancelled, timed out, or failed fetching the shard logs).\n'
            fi
          } > "$body"
          # Plain list, NOT `--search`: `--search` reads GitHub's separately
          # maintained, eventually-consistent search index, so an issue this
          # workflow created minutes ago can be invisible to the next run and a
          # duplicate gets opened. The plain list reads current state.
          # Every `gh` call here is bounded; see this job's timeout above. A
          # bounded call fails fast and loudly.
          num=$(timeout 120 gh issue list --state open --limit 100 --json number,title \
                  --jq 'first(.[] | select(.title == env.SWEEP_ISSUE_TITLE) | .number)') || {
            printf 'FATAL: could not query issues — this sweep failure has no observer.\n' >&2
            exit 1
          }
          # The write half needs the same treatment: a hung comment/create is
          # indistinguishable from a posted one unless it is bounded and its
          # failure is surfaced.
          if [ -n "$num" ]; then
            timeout 120 gh issue comment "$num" --body-file "$body" || {
              printf 'FATAL: could not comment on issue #%s — this sweep failure has no observer.\n' "$num" >&2
              exit 1
            }
          else
            timeout 120 gh issue create --title "$SWEEP_ISSUE_TITLE" --body-file "$body" || {
              printf 'FATAL: could not open the tracking issue — this sweep failure has no observer.\n' >&2
              exit 1
            }
          fi
