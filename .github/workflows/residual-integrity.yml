name: residual-integrity

# Enforces that a findings file's parsed `summary:` counters agree with its own
# body, and that a residual shard's checkbox agrees with its own prose.
# Without a runner, that is prose-only compliance — the exact failure mode in
# docs/solutions/logic-errors/a-closure-claim-in-prose-is-not-the-field-a-consumer-parses.md,
# whose eight occurrences were each found by a human noticing prose disagreed
# with a field. `/cepa:sweep` and `/cepa:triage` read the field.
#
# The residual-integrity check is read-only and takes seconds. Its pass
# condition, its four legs, and its stated limits are defined in scripts/check-residual-integrity.sh's
# own header (leg 1 itself is plugins/cepa/scripts/check-findings-file.sh,
# which that script sources) — read them there rather than inferring them from this comment or
# from any one leg's output verb.
#
# WHY LEG 1 FAILS AND LEGS 2-4 DO NOT: legs 2-4 read prose written by people,
# where the fix for a false positive is to mangle correct writing. The checker
# owns that argument; this workflow just runs it. A green run here with WARN
# lines in the log is the designed state, not a deferred failure.
#
# Security: this workflow interpolates NO event data (no ${{ github.event.* }})
# into any run: step — every step is a static `bash scripts/...` invocation, so
# there is no injection surface. Keep it that way: if a future step needs event
# data, pass it through env: with quoting rather than interpolating it into the
# run: body.
#
# Action pinning, the bump recipe, and the JS-runtime eligibility constraint on
# major versions are documented in .github/workflows/model-pins.yml. This
# workflow CITES that file rather than restating it — a second copy is how the
# two rationales in CLAUDE.md's model-pin history diverged.

# Deliberately NOT path-filtered, for the reason model-pins.yml states: a PR
# that moves a findings file outside the filtered paths would show no check at
# all, which reads as "nothing to review" rather than as a failure, and a
# path-filtered required check can never be satisfied on the PRs it skips.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Three jobs, not one (punch-list L31). One job ran every step in series
  # and took 7m42s-8m58s of its 10-minute bound on main by 2026-10-31
  # (`gh run list --branch main --workflow residual-integrity.yml`); a
  # cancelled job reads as a red check on every PR. The jobs run in parallel,
  # each under its own bound. The `check` job's comments below on step order
  # and on the bound apply to all three: in each job a checker runs before its
  # controls, and every step keeps the `if: always()` it had. Per-job times are
  # hosted step times from run 41210093858 (`gh run view <id> --json jobs`).
  # A new step goes in the job whose subject it shares; when a job nears half
  # its bound, split it again rather than raise the bound.
  check:
    # Every check that is not an Orca check. About two minutes.
    # The bound exists because this job reads files reachable from an
    # untrusted PR branch, and the default is 360 minutes. Same rationale
    # as model-pins.yml's `check` job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Policy check first, controls second with `if: always()`. Both always
      # run, so neither hides the other, and a genuinely drifted counter in a
      # PR trips the CHECKER rather than being reported as a broken harness —
      # model-pins.yml records why the reverse order inverts the diagnostic.
      - name: Check residual integrity
        run: bash scripts/check-residual-integrity.sh
      - name: Check residual-integrity checker controls
        if: always()
        run: bash scripts/check-residual-integrity-controls.sh
      # The counting rule ships in the plugin
      # (plugins/cepa/scripts/check-findings-file.sh) and every findings-file
      # writer runs it through the cepa:file-todos Self-check block. The step
      # above already drives it through the repo checker; this one pins the
      # standalone contract, the block itself (extracted and run from a
      # non-cepa directory), and each writer's citation. Static command, no
      # workflow-context interpolation.
      - name: Check shipped findings-file check controls
        if: always()
        run: bash scripts/check-findings-file-controls.sh
      # Fixtures for the three sweep branch-classes no repo in the portfolio
      # can produce: multiple merged PRs on one head, non-trunk base's
      # negative path, and MERGED+OPEN on one head. Field runs cannot cover
      # them, so a regression here is invisible without this. Static command,
      # no workflow-context interpolation.
      - name: Check sweep branch classification
        if: always()
        run: bash scripts/check-sweep-branch-classes.sh
      # The batch-sibling pattern decides which open PR a `batch:` run may
      # treat as a sibling. It must admit the worktree form <type>/<wt>/<id>-
      # without letting a worktree NAMED <id>-x create a false sibling, and it
      # must exist in exactly one place. The script reads the shipped pattern
      # and carries its own fixtures and mutants. Static command, no
      # workflow-context interpolation.
      - name: Check batch sibling match
        if: always()
        run: bash scripts/check-batch-sibling-match.sh
      # A worktree coordinator writes only when its worktree is parked
      # (autonomy section 10f). The script runs 10f's own probe against
      # fixture repos and checks that every command cites 10f and grants the
      # probe's git verbs; its header owns the legs and limits. Static
      # command, no workflow-context interpolation.
      - name: Check worktree-coordinator write guard
        if: always()
        run: bash scripts/check-coord-write-guard.sh
      # A read-only dispatch needs no worktree, and the cleanup removes only
      # this run's own agent-* worktrees (autonomy section 11). The script runs
      # 11b's blocks against fixture repos with planted agent worktrees and
      # checks the READ-ONLY brief line and every dispatch site's citations;
      # its header owns the legs and limits. Static command, no
      # workflow-context interpolation.
      - name: Check dispatch isolation
        if: always()
        run: bash scripts/check-dispatch-isolation.sh
      # Residual 2g: a fenced-block instruction file must never carry state
      # across a block boundary in a shell variable. SIX instances shipped on
      # the brain-writeback surface alone, and instances 5 and 6 were each
      # written BY the session enforcing the rule, in the block it was adding,
      # with 2g's text on screen — so review is measurably not holding this and
      # a runner is the only thing that will. Unlike check-plugin-freshness.sh
      # this CAN be gated: it reads tracked files only and needs no local
      # install state. Static command, no workflow-context interpolation.
      - name: Check fenced-block state crossing
        if: always()
        run: bash scripts/check-fenced-block-state.sh
      - name: Check fenced-block-state checker controls
        if: always()
        run: bash scripts/check-fenced-block-state-controls.sh
      # brain-client.sh's argument guards. Same rationale as the step above —
      # a field run cannot cover these, because the failure they prevent is
      # SILENT: the three recorded incidents (2026-08-06, 08-22, 08-23) each
      # returned a plausible result and no error, and were found by humans
      # noticing missing rows weeks later. Offline and read-only: every case
      # stops at a guard, which runs before any credential load. Static
      # command, no workflow-context interpolation.
      - name: Check brain-client argument guards
        if: always()
        run: bash scripts/check-brain-client-args.sh

  orca-detection:
    # Orca detection and turn endings. About three and a half minutes
    # (3m25s on PR #104), almost all of it the detection controls.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Orca detection (autonomy section 12a) decides whether a run routes its
      # hand-offs through Orca. The check runs the shipped block against stub
      # CLIs and the controls mutate it; their headers own the legs and limits.
      # The controls took about three minutes hosted; the check's BOUNDS and
      # TITLE-BOUNDS legs keep them inside this job's timeout. Static
      # commands, no workflow-context interpolation.
      - name: Check Orca detection
        if: always()
        run: bash scripts/check-orca-detection.sh
      - name: Check Orca detection controls
        if: always()
        run: bash scripts/check-orca-detection-controls.sh
      # How a turn ends under Orca (autonomy section 12b rule 7) is cited once
      # and restated nowhere. The check guards the rule and every citation of
      # it; the controls mutate it. Text checks only, a few seconds. Headers
      # own the legs and limits. Static commands, no workflow-context
      # interpolation.
      - name: Check Orca turn endings
        if: always()
        run: bash scripts/check-orca-turn-endings.sh
      - name: Check Orca turn endings controls
        if: always()
        run: bash scripts/check-orca-turn-endings-controls.sh

  orca-nudge:
    # Orca nudge, send and health. Almost all of the time is the controls:
    # 2m47s on PR #106; PR #109 added the health part (its controls took
    # 3m10s locally on 4 cores). Each mutant runs only the part of the check
    # that can see it; before that split this job hit its 10-minute bound.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The autonomy section 12b rule 1 send runs only through
      # plugins/cepa/scripts/orca-send.sh, which counts a send only by its
      # stored result.message.id, then runs orca-nudge.sh, which nudges an
      # idle (`done`) target only; orca-health.sh is the section 12b rule 8
      # health check. The check runs all three against a
      # stub CLI and never reaches a real terminal; the controls mutate it.
      # Headers own the cases and limits. Static commands, no workflow-context
      # interpolation.
      - name: Check Orca nudge
        if: always()
        run: bash scripts/check-orca-nudge.sh
      - name: Check Orca nudge controls
        if: always()
        run: bash scripts/check-orca-nudge-controls.sh
