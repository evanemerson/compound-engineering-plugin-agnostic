    # ran the check, was cancelled at 12m15s (run 44612546947), so PR #146 went
    # to 32 and moved the check to its own job. Locally shard 1/12 took
    # 4m26s and shard 1/99 (5 mutants) 2m19s: about 2 minutes of baseline,
    # then about 4.4s a mutant locally and about 12s hosted, where 8
    # mutants share 4 cores.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Orca nudge controls (shard 32/32)
        if: always()
        run: bash scripts/check-orca-nudge-controls.sh --shard 32/32

  orca-lane:
    # The lane lifecycle (autonomy section 12b rule 2) runs only through
    # plugins/cepa/scripts/orca-lane.sh, which creates, names and removes a
    # lane through Orca and proves each by a complete read. The check runs it
    # in throwaway git repos against a stub CLI and never reaches a real
    # Orca; the controls mutate it. About 100 seconds for the check locally.
    # Headers own the legs and limits. This job runs only the check. The
    # controls run as shards 1/24 to 24/24 in jobs orca-lane-1 to
    # orca-lane-24, one per job (the orca-nudge pattern, punch-list L42): as
    # one job they took 12m06s with PR #133's mutants and were cancelled at
    # the bound, 4 shards took up to 9m58s with PR #134's, and 8 shards took
    # 7m11s to 10m24s with PR #143's 145 mutants (run 44329468205, two
    # cancelled at the bound). Every shard first runs the unmutated copy
    # through the check, so each costs that baseline plus its mutants: locally
    # shard 1/8 took 5m41s and shard 1/16 3m52s. The check moved to its own
    # job because shard 1 ran that baseline twice. The controls fail unless
    # each shard runs here exactly once. Static commands, no workflow-context
    # interpolation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Orca lane
        if: always()
        run: bash scripts/check-orca-lane.sh

