  stack-gate:
    # Every worktree Docker stack starts through
    # plugins/cepa/scripts/stack-gate.sh (punch-list L66), which counts the
    # running -wt- stacks and free memory and runs the start under its lock.
    # The check runs it against a stub docker and a fixture meminfo and never
    # reaches Docker; the controls mutate it. About 15 seconds for the check,
    # 4 minutes for the controls. Headers own the legs and limits. Static
    # commands, no workflow-context interpolation.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check stack gate
        if: always()
        run: bash scripts/check-stack-gate.sh
      - name: Check stack gate controls
        if: always()
        run: bash scripts/check-stack-gate-controls.sh

  lane-stack:
    # The lane & stack scheme skill (plugins/cepa/skills/lane-stack/SKILL.md,
    # punch-list L62). The check parses its orca.yaml example, reads its gate
    # contract, runs its `make up` example in throwaway git repos with a stub
    # gate, and checks the coord@main first-prompt template; the controls
    # mutate the skill. Headers own the legs and limits. Static commands, no
    # workflow-context interpolation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check lane-stack skill
        if: always()
        run: bash scripts/check-lane-stack.sh
      - name: Check lane-stack skill controls
        if: always()
        run: bash scripts/check-lane-stack-controls.sh
      # /cepa:setup's check of a repo against the skill (punch-list L67,
      # plugins/cepa/scripts/lane_scheme.py): fixture repos built from the
      # skill's own examples, one gap per case; the controls mutate the probe.
      - name: Check lane scheme probe
        if: always()
        run: bash scripts/check-lane-scheme.sh
      - name: Check lane scheme probe controls
        if: always()
        run: bash scripts/check-lane-scheme-controls.sh

  orca-outbox:
    # The coord:<repo> address (autonomy section 12b rules 1 and 8, punch-list
    # L61): orca-send.sh writes each coord: message to an outbox on disk and
    # resolves it to the one live coord@main, orca-health.sh reports what is
    # undelivered, and orca-outbox.sh is the receiver's drain. The check runs
    # them in throwaway git repos against a stub CLI and a temp outbox and
    # never reaches a real Orca; the controls mutate them. About 45 seconds
    # locally. Headers own the legs and limits. Static commands, no
    # workflow-context interpolation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Orca outbox
        if: always()
        run: bash scripts/check-orca-outbox.sh
      - name: Check Orca outbox controls
        if: always()
        run: bash scripts/check-orca-outbox-controls.sh


  orca-cli-path:
    # punch-list L81: on Linux Orca's cli is an absolute path whose basename
    # is orca, which is also the GNOME screen reader's name. The check runs
    # every site of the cli check against planted launchers and stub tools,
    # never a real Orca; the controls mutate each site. Headers own the legs
    # and limits. Static commands, no workflow-context interpolation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Orca cli path
        if: always()
        run: bash scripts/check-orca-cli-path.sh
      - name: Check Orca cli path controls
        if: always()
        run: bash scripts/check-orca-cli-path-controls.sh

  orca-attention:
    # The attention flag (autonomy section 12b rule 7) runs only through
    # plugins/cepa/scripts/orca-attention.sh, which marks this checkout's own
    # Orca worktree unread with a NEEDS YOU comment and clears it, proving
    # each by a re-read. The check runs it in a throwaway git repo against a
    # stub CLI and never reaches a real Orca; the controls mutate it. Headers
    # own the legs and limits. Static commands, no workflow-context
    # interpolation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Orca attention
        if: always()
        run: bash scripts/check-orca-attention.sh
      - name: Check Orca attention controls
        if: always()
        run: bash scripts/check-orca-attention-controls.sh
