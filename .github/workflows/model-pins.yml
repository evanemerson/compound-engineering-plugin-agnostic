name: model-pins

# Enforces the "every dispatch declares its model" rule in CLAUDE.md.
# Without a runner, that rule is prose-only compliance — which is the exact
# failure mode documented in
# docs/solutions/logic-errors/unpinned-subagent-dispatches-inherit-the-session-model.md
#
# The check is read-only and takes seconds. Its pass condition is defined by
# `cepa:autonomy` §9f — read it there rather than inferring it from this
# comment or from any one leg's output verb.
#
# Security: this workflow interpolates NO event data (no ${{ github.event.* }})
# into any run: step, so there is no injection surface. Keep it that way — if
# a future step needs event data, pass it through env: with quoting.
#
# Action pinning: every third-party action is pinned to a FULL 40-char commit
# SHA with a trailing `# vX.Y.Z` naming the tag that SHA was resolved from. A
# version tag is mutable — `v4` is repointed by its publisher — so a tag pin
# grants every future publisher push write access to this job.
#
# To bump: re-resolve the SHA from upstream and replace BOTH the SHA and the
# comment together —
#
#     gh api repos/actions/checkout/git/refs/tags/v7.0.2 --jq .object.sha
#
# Never edit the comment alone (it then lies about which commit runs), and
# never restore a bare tag.
#
# ELIGIBLE MAJORS ARE CONSTRAINED BY THE JS RUNTIME, not by recency, and this
# is the one place that constraint is written down — the sibling workflows cite
# it rather than restate it. GitHub removes Node 20 from the runner on
# 2026-09-16; `actions/checkout` declares its runtime in its own `action.yml`
# `runs.using`, and v4.x is the last `node20` line (v5.0.0 was exactly that
# change and nothing else). So a bump target must be v5 or later — read the
# candidate's own runtime before pinning it, rather than trusting this note to
# age well:
#
#     gh api "repos/actions/checkout/contents/action.yml?ref=v7.0.2" \
#       --jq .content | tr -d '\n' | base64 -d | grep -A2 '^runs:'
#
# Downgrading to a v4.x SHA is therefore not a neutral rollback; after
# 2026-09-16 it is a job with no interpreter.
#
# Dependabot keeps these pins current — `.github/dependabot.yml`, weekly,
# grouped so every workflow's SHA moves together. Adopted 2026-08-09 after three
# deferrals; the reasoning and the objection that died are in
# memory/tasks.d/2026-08-06-feat-runner-runtime-detector.md. Read them there.
#
# It does NOT make the recipe above dead letter, and that matters more now that
# it is the path nobody walks. Dependabot rewrites the `uses:` SHA and its
# `# vX.Y.Z` comment, and nothing else — it ranks candidates by version, not by
# the `runs.using` runtime the eligibility rule below turns on. Moving forward is
# the safe direction and is what fixes the staleness this repo already paid for
# once, but that rule is still what decides whether a proposed bump is mergeable:
# read the candidate's own runtime rather than trusting a bot's PR title.

# Deliberately NOT path-filtered. A filter buys nothing here (the check
# takes seconds) and costs correctness twice: a PR that moves agent
# definitions outside the filtered paths shows no check at all — which reads
# as "nothing to review", not as a failure — and a path-filtered required
# check can never be satisfied on the PRs it skips.
on:
  pull_request:
  push:
    branches: [main]

# The `check` job inherits this and needs nothing more. `actions: read` is
# granted at JOB scope in `sweep-freshness` instead of here — see that job for
# why a credential must not share a job with PR-authored scripts.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Both checks finish in seconds. The bound exists because this job reads
    # files reachable from an untrusted PR branch, and the default is 360
    # minutes: a read that blocks (a symlinked device or FIFO — see leg 4's
    # root loop) would otherwise hold a runner for six hours per push. The
    # script excludes non-regular files by construction; this is the backstop
    # for the case that guard is ever weakened.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Policy check first, controls second with `if: always()`. Both always
      # run, so neither hides the other. Controls-first was tried and inverted
      # the diagnostic on the common case: the controls build a fixture from
      # the tree, so a genuinely unpinned dispatch in a PR trips their BASELINE
      # gate, and the red step is then named after the harness while the step
      # named after the policy is skipped entirely. See `cepa:autonomy` §9f.
      - name: Check model pins
        run: bash scripts/check-model-pins.sh
      - name: Check model-pin checker controls
        if: always()
        run: bash scripts/check-model-pins-controls.sh
      # The runner has defaulted to Node 24 since 2026-06-16, so
      # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 is a no-op today and is deliberately
      # NOT set — it was correct advice in the 2025-09-19 changelog and the
      # platform moved past it. The variable that still bites is the opposite
      # escape hatch, named in the runner's own message: it forces workflows
      # BACK onto the dying runtime, which silences the very warning the
      # `runtime-deprecation` job below exists to observe. Silencing the
      # detector reads as a clean pass, so it fails here instead.
      #
      # SCOPE, stated because it is narrower than it looks: this sees only the
      # literal string committed under .github/. It cannot see the variable set
      # as a repo-level Actions variable in the web UI, nor one exported at
      # runtime by a third-party action via $GITHUB_ENV. Nothing in scope does
      # either today — actions/checkout is the only pinned action.
      - name: Refuse the deprecated-runtime escape hatch
        if: always()
        run: |
          # The needle is ASSEMBLED AT RUN TIME so this guard cannot match its
          # own source. Written as one literal, `grep -rn <name> .github/` finds
          # this very line on a clean tree and the step is permanently red —
          # caught by running it, not by reading it. That is the same defect
          # this repo already carries one live instance of (a zero-coverage
          # floor whose scan root contains the file declaring it), and the same
          # reason the sibling scripts construct a section sign rather than
          # writing one.
          needle="ACTIONS_ALLOW_USE_UNSECURE_NODE""_VERSION"
          if grep -rn "$needle" .github/; then
            printf '::error::the above pins a workflow to a deprecated JS runtime and silences the runtime-deprecation observer. Bump the action instead\n'
            exit 1
          fi
          printf 'no deprecated-runtime escape hatch under .github/ (needle: %s)\n' "$needle"

  # Detects GitHub's SILENT 60-day disable of `schedule:` workflows, which
  # would otherwise stop the mutation sweep with no run, no notification and
  # no failed check anywhere. What this detector is for, why it is
  # push-triggered rather than a second scheduled job, why it warns instead of
  # failing, and how its `UNVERIFIED` differs from §9's evidence-field
  # `UNVERIFIED` are all `cepa:autonomy` §9f — read them there.
  #
  # ITS OWN JOB, and that is a security boundary, not tidiness. The `check`
  # job runs `bash scripts/*.sh` FROM THE PR HEAD — attacker-authored on a
  # fork PR. A step in that job holding `GH_TOKEN` is reachable by an earlier
  # step: `$GITHUB_PATH` is written by one step and prepended to `PATH` for
  # every later step in the SAME job, so a PR that appends a `gh` shim to it
  # receives the token in that shim's environment. The exposure is bounded
  # today (a fork `pull_request` token is read-only regardless of the
  # `permissions:` block), but the bound is GitHub's, not ours, and a later
  # widening — or a switch to `pull_request_target` — would land on a design
  # that had assumed the question settled. A separate job shares no PATH, no
  # filesystem, and no checkout: it needs none of the repo, only the API.
  #
  # The one implementation rule that belongs at this site rather than in §9f:
  # every failure path below exits 0 explicitly AFTER emitting a warning.
  # There is deliberately no silent fall-through — a detector that cannot tell
  # "fresh" from "did not parse" is the exact defect it exists to catch, and
  # this one shipped with that path before review reproduced it.
  sweep-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Read-only workflow-run metadata, and nothing else — no `contents`,
      # because this job never checks the repo out.
      actions: read
    steps:
      - name: Mutation sweep freshness
        env:
          GH_TOKEN: ${{ github.token }}
          # Two missed weekly cycles plus slack. Tight enough that a disable is
          # noticed inside a fortnight, loose enough that one skipped run is not
          # a warning.
          STALE_AFTER_DAYS: 16
        run: |
          set -o pipefail
          # `status=success`, not merely the newest run. A sweep that fails its
          # classifier selftest, or is CANCELLED by timeout-minutes — the
          # outcome mutation-sweep.yml calls the one most worth knowing about —
          # still creates a run record and still refreshes `created_at`. Keying
          # on the newest run of ANY conclusion would print "last ran 2 days
          # ago" on every PR while the sweep had verified nothing for months:
          # a freshness detector reporting liveness instead of evidence.
          #
          # stderr to a file, not 2>&1: on a 404 `gh` writes the API's JSON
          # body to STDOUT, so merging them put a raw blob inside the warning
          # annotation. Observed on the first hosted run of this step.
          if ! out=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/mutation-sweep.yml/runs?status=success&per_page=1" \
                --jq '.workflow_runs[0].created_at // ""' 2>"$RUNNER_TEMP/gh.err"); then
            reason=$(head -c 300 "$RUNNER_TEMP/gh.err" | head -1)
            # This branch is entered on ANY gh failure — 404, 403, rate limit,
            # network, missing binary — so it leads with the actual stderr and
            # offers the 404 reading as the likeliest, never as the diagnosis.
            printf '::warning::mutation sweep freshness UNVERIFIED: %s. If that is a 404, no workflow of that name is registered — expected until it reaches the default branch, and a rename or a deletion after that\n' \
              "${reason:-no reason reported}"
            exit 0
          fi
          if [ -z "$out" ]; then
            printf '::warning::the mutation sweep has no SUCCESSFUL run on record — it has either never run, or never passed. Dispatch it once; that also calibrates its timeout-minutes, which is still an unmeasured 3x of a local figure\n'
            exit 0
          fi
          # Parsed into a variable and gated, NOT inlined into the arithmetic.
          # Inlined, an unparseable timestamp leaves `age` empty, `[ "" -gt N ]`
          # errors, an `if` reads that error as false, and control falls to the
          # reassuring else-branch: no annotation, exit 0, "last ran  days ago"
          # with a blank number. `set -e` does not abort on an arithmetic error
          # inside an assignment, so nothing else catches it either. Reproduced
          # under GitHub's own `bash -e` shell before this guard existed.
          if ! ts=$(date -u -d "$out" +%s 2>/dev/null) || [ -z "$ts" ]; then
            printf '::warning::mutation sweep freshness UNVERIFIED: could not parse the run timestamp %s\n' "$out"
            exit 0
          fi
          age=$(( ( $(date -u +%s) - ts ) / 86400 ))
          if [ "$age" -gt "$STALE_AFTER_DAYS" ]; then
            printf '::warning::the last SUCCESSFUL mutation sweep was %s days ago (%s), past its %s-day bound. A weekly schedule that stops producing passing runs is what a 60-day inactivity disable looks like — re-enable it in the Actions tab, or dispatch it\n' \
              "$age" "$out" "$STALE_AFTER_DAYS"
          else
            printf 'last successful mutation sweep: %s days ago (%s)\n' "$age" "$out"
          fi

  # Observes the deprecation warning the RUNNER ALREADY EMITS, rather than
  # re-deriving each pinned action's runtime from upstream. Verified against
  # this repo's own history: run 30867814226 (2026-08-04, two days before the
  # v4.4.0 -> v7.0.1 bump) carries
  #
  #   ##[warning]Node.js 20 is deprecated. The following actions target
  #   Node.js 20 but are being forced to run on Node.js 24:
  #   actions/checkout@11d5960a326750d5838078e36cf38b85af677262
  #
  # naming the offending action BY ITS PINNED SHA. That warning sat in this
  # repo's logs for months with nothing watching it, which is why the node20
  # deadline was found by a human asking about it by name. The gap was never a
  # missing signal — it was an authoritative signal with no observer, the same
  # finding this file's `sweep-freshness` job exists to close one layer up.
  #
  # ITS OWN JOB, no checkout — the same security boundary `sweep-freshness`
  # documents above: a token must not share a job with `bash scripts/*.sh` run
  # from a PR head, because `$GITHUB_PATH` is prepended for every later step in
  # the same job. This job parses no repo content at all — it greps API output —
  # so no repo-derived value ever reaches an argument position.
  #
  # Every failure path exits 0 AFTER emitting a warning, and every count it
  # reports is one it actually measured. Absence of the annotation is the
  # HEALTHY state, so "found nothing" and "looked at nothing" are otherwise
  # indistinguishable — that ambiguity is the whole defect class this repo keeps
  # paying for, and the inspected/annotation counters are what rule it out.
  runtime-deprecation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Stated explicitly rather than inherited by reference. Unlisted scopes
      # are set to `none` by GitHub, so copying `sweep-freshness`'s
      # `actions: read` alone would 403 on the check-runs calls.
      actions: read   # list workflows and their runs
      checks: read    # check-suites -> check-runs -> annotations
      issues: write   # the observer itself
    steps:
      - name: Runtime deprecation observer
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: a pinned action targets a deprecated runner runtime
          # Warn-then-escalate. An immediate MISS reddens every unrelated PR for
          # as long as the condition stands, and `cepa:autonomy` 9f already
          # records where that leads: failing unrelated PRs is how a signal gets
          # routed around. But warn-forever is the same no-observer failure one
          # layer up, so the check goes red once the tracking issue has been
          # open this long. The clock is the issue's own created_at — NOT a
          # countdown to a hardcoded removal date, which would reintroduce the
          # policy table this design deleted and would itself go stale. What is
          # worth reddening a PR over is not the calendar; it is "this has been
          # ignored for three weeks".
          ESCALATE_AFTER_DAYS: 21
        run: |
          set -o pipefail
          err="$RUNNER_TEMP/gh.err"
          # stderr to a file, never 2>&1: on a 404 `gh` writes the API's JSON
          # body to STDOUT, which would put a raw blob inside the annotation.
          # Same lesson as sweep-freshness, observed on its first hosted run.
          api() { gh api "$@" 2>"$err"; }

          if ! tip=$(api "repos/$GITHUB_REPOSITORY" --jq '.default_branch' ) \
             || [ -z "$tip" ]; then
            printf '::warning::runtime deprecation UNVERIFIED: could not resolve the default branch: %s\n' \
              "$(head -c 300 "$err" | head -1)"
            exit 0
          fi
          if ! tip_sha=$(api "repos/$GITHUB_REPOSITORY/commits/$tip" --jq '.sha') \
             || [ -z "$tip_sha" ]; then
            printf '::warning::runtime deprecation UNVERIFIED: could not resolve %s tip: %s\n' \
              "$tip" "$(head -c 300 "$err" | head -1)"
            exit 0
          fi

          if ! wfs=$(api "repos/$GITHUB_REPOSITORY/actions/workflows" \
                       --jq '.workflows[] | [.id, .name] | @tsv'); then
            printf '::warning::runtime deprecation UNVERIFIED: could not list workflows: %s\n' \
              "$(head -c 300 "$err" | head -1)"
            exit 0
          fi
          if [ -z "$wfs" ]; then
            printf '::warning::runtime deprecation UNVERIFIED: zero workflows enumerated — a scan over nothing is not a pass\n'
            exit 0
          fi

          inspected=0; skipped=0; annotations=0; unread=0; hits=""
          while IFS=$(printf '\t') read -r wf_id wf_name; do
            [ -n "$wf_id" ] || continue
            run=$(api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf_id/runs?status=completed&branch=$tip&per_page=1" \
                    --jq '.workflow_runs[0] | [.id, .head_sha, .check_suite_id] | @tsv') || run=""
            if [ -z "$run" ]; then
              printf 'SKIP  %s — no completed run on %s\n' "$wf_name" "$tip"
              skipped=$((skipped + 1)); continue
            fi
            run_id=$(printf '%s' "$run" | cut -f1)
            head_sha=$(printf '%s' "$run" | cut -f2)
            suite=$(printf '%s' "$run" | cut -f3)
            # Evidence must describe the CURRENT PINS — which is not the same as
            # "must be at the tip", and the difference is the whole correctness
            # of this job.
            #
            # Requiring the tip was the first cut, and it was measured wrong
            # BOTH ways. It correctly killed a false positive (`changelog` and
            # `mutation-sweep` sat at pre-bump commits still carrying the old
            # node20 annotation). But it then made the job observe NOTHING: this
            # step runs INSIDE model-pins, so model-pins' newest *completed* run
            # is always the previous commit's — a run can never see itself — and
            # every other workflow is at tip only by coincidence. First run on
            # main after merging: 3 skipped, 0 inspected, permanent UNVERIFIED.
            #
            # The annotation depends only on which actions are pinned, so a run
            # at an ANCESTOR commit is valid evidence as long as no workflow file
            # changed in between. That is what is asked here.
            if [ "$head_sha" = "$tip_sha" ]; then
              provenance="at tip"
            else
              drift=$(api "repos/$GITHUB_REPOSITORY/compare/$head_sha...$tip_sha" \
                        --jq '[.files[].filename | select(startswith(".github/workflows/"))] | length')
              if [ -z "$drift" ]; then
                printf 'SKIP  %s — could not compare run %s at %s against the tip: %s\n' \
                  "$wf_name" "$run_id" "${head_sha:0:12}" "$(head -c 200 "$err" | head -1)"
                skipped=$((skipped + 1)); continue
              fi
              if [ "$drift" -ne 0 ]; then
                printf 'SKIP  %s — run %s is at %s and %s workflow file(s) changed since (stale evidence)\n' \
                  "$wf_name" "$run_id" "${head_sha:0:12}" "$drift"
                skipped=$((skipped + 1)); continue
              fi
              provenance="at ${head_sha:0:12}, pins unchanged since"
            fi
            if [ -z "$suite" ] || [ "$suite" = "null" ]; then
              printf 'SKIP  %s — run %s reported no check suite\n' "$wf_name" "$run_id"
              skipped=$((skipped + 1)); continue
            fi
            crs=$(api "repos/$GITHUB_REPOSITORY/check-suites/$suite/check-runs" \
                    --jq '.check_runs[].id') || crs=""
            if [ -z "$crs" ]; then
              printf 'SKIP  %s — no check runs resolved for run %s\n' "$wf_name" "$run_id"
              skipped=$((skipped + 1)); continue
            fi
            inspected=$((inspected + 1))
            printf 'READ  %s — run %s (%s)\n' "$wf_name" "$run_id" "$provenance"
            for cr in $crs; do
              # NOT `|| continue`. A failed annotations call and a check-run
              # with no annotations both leave `msgs` empty, so collapsing them
              # makes "the API refused us" print the same summary line as "we
              # looked and it was clean" — the silent pass this job's own header
              # forbids, and the exact reason `unread` is reported separately
              # below rather than folded into `annotations`.
              if ! msgs=$(api "repos/$GITHUB_REPOSITORY/check-runs/$cr/annotations" \
                            --jq '.[].message'); then
                printf '::warning::could not read annotations for check-run %s: %s\n' \
                  "$cr" "$(head -c 200 "$err" | head -1)"
                unread=$((unread + 1)); continue
              fi
              [ -n "$msgs" ] || continue
              n=$(printf '%s\n' "$msgs" | grep -c . || true)
              annotations=$((annotations + n))
              # STRUCTURAL match — no version literal, so the next runtime cycle
              # is caught without an edit here. That is an assumption about
              # GitHub's wording, not a contract; see the residual shard for the
              # re-verification trigger.
              hit=$(printf '%s\n' "$msgs" | grep -Ei 'node(\.js)?[[:space:]]*[0-9]+[[:space:]]+(is|are)([[:space:]]+being)?[[:space:]]+deprecated' || true)
              [ -n "$hit" ] && hits=$(printf '%s\n%s — %s' "$hits" "$wf_name" "$hit")
            done
          done <<< "$wfs"

          if [ "$inspected" -eq 0 ]; then
            printf '::warning::runtime deprecation UNVERIFIED: %s workflows enumerated but none had a usable run at the %s tip — this is not a clean pass, it is no evidence\n' \
              "$skipped" "$tip"
            exit 0
          fi

          if [ -z "$hits" ]; then
            if [ "$unread" -gt 0 ]; then
              printf '::warning::no deprecation warnings found, but %s check-run(s) would not surrender their annotations — this pass is QUALIFIED, not clean\n' "$unread"
            fi
            printf 'no runtime deprecation warnings: inspected %s run(s), read %s annotation(s), %s unreadable, skipped %s workflow(s) with stale or missing runs\n' \
              "$inspected" "$annotations" "$unread" "$skipped"
            exit 0
          fi

          printf '::warning::a pinned action targets a deprecated runner runtime:%s\n' "$hits"

          # The issue is the observer. Filed only on push to the default branch:
          # a fork `pull_request` token is read-only regardless of the
          # permissions block, so attempting it on a PR would fail for a reason
          # unrelated to the finding.
          num=$(api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                  --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | .[0].number // \"\"") || num=""
          opened=$(api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                  --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | .[0].created_at // \"\"") || opened=""

          if [ -n "$opened" ]; then
            # Parsed into a variable and gated BEFORE the arithmetic. Inlined,
            # an unparseable timestamp leaves the operand empty, `[ "" -gt N ]`
            # errors, `if` reads that error as false, and control falls to the
            # reassuring branch — and `set -e` does not abort on an arithmetic
            # error inside an assignment. This exact bug shipped in the job
            # above before review reproduced it.
            if ts=$(date -u -d "$opened" +%s 2>/dev/null) && [ -n "$ts" ]; then
              age=$(( ( $(date -u +%s) - ts ) / 86400 ))
              if [ "$age" -gt "$ESCALATE_AFTER_DAYS" ]; then
                printf '::error::this has been open %s days (issue #%s, since %s), past its %s-day bound. Bump the pin\n' \
                  "$age" "$num" "$opened" "$ESCALATE_AFTER_DAYS"
                exit 1
              fi
              printf 'tracking issue #%s open %s days of %s\n' "$num" "$age" "$ESCALATE_AFTER_DAYS"
            else
              printf '::warning::could not parse tracking issue #%s created_at %s — escalation clock UNVERIFIED\n' \
                "$num" "$opened"
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            printf 'not filing an issue: event is %s, and a fork pull_request token is read-only\n' "$GITHUB_EVENT_NAME"
            exit 0
          fi
          body="$RUNNER_TEMP/issue-body.md"
          {
            printf 'The runner reports a pinned action on a deprecated JS runtime.\n\n'
            printf 'Run: %s/%s/actions/runs/%s\n\n```\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '%s\n' "$hits"
            printf '```\n\nThe warning names the action by its pinned SHA. Bump it per the\n'
            printf 'action-pinning recipe in `.github/workflows/model-pins.yml`.\n'
          } > "$body"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$body" \
              || printf '::warning::could not comment on issue #%s\n' "$num"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$body" \
              || printf '::warning::could not open the tracking issue\n'
          fi
