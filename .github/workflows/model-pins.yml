name: model-pins

# Enforces the "every dispatch declares its model" rule in CLAUDE.md.
# Without a runner, that rule is prose-only compliance — which is the exact
# failure mode documented in
# docs/solutions/logic-errors/unpinned-subagent-dispatches-inherit-the-session-model.md
#
# The check is read-only and takes seconds. Its pass condition is defined by
# `cepa:autonomy` §9f — read it there rather than inferring it from this
# comment or from any one leg's output verb.
#
# Security: this workflow interpolates NO event data (no ${{ github.event.* }})
# into any run: step, so there is no injection surface. Keep it that way — if
# a future step needs event data, pass it through env: with quoting.
#
# Action pinning: every third-party action is pinned to a FULL 40-char commit
# SHA with a trailing `# vX.Y.Z` naming the tag that SHA was resolved from. A
# version tag is mutable — `v4` is repointed by its publisher — so a tag pin
# grants every future publisher push write access to this job.
#
# To bump: re-resolve the SHA from upstream and replace BOTH the SHA and the
# comment together —
#
#     gh api repos/actions/checkout/git/refs/tags/v7.0.2 --jq .object.sha
#
# Never edit the comment alone (it then lies about which commit runs), and
# never restore a bare tag.
#
# ELIGIBLE MAJORS ARE CONSTRAINED BY THE JS RUNTIME, not by recency, and this
# is the one place that constraint is written down — the sibling workflows cite
# it rather than restate it. GitHub removes Node 20 from the runner on
# 2026-09-16; `actions/checkout` declares its runtime in its own `action.yml`
# `runs.using`, and v4.x is the last `node20` line (v5.0.0 was exactly that
# change and nothing else). So a bump target must be v5 or later — read the
# candidate's own runtime before pinning it, rather than trusting this note to
# age well:
#
#     gh api "repos/actions/checkout/contents/action.yml?ref=v7.0.2" \
#       --jq .content | tr -d '\n' | base64 -d | grep -A2 '^runs:'
#
# Downgrading to a v4.x SHA is therefore not a neutral rollback; after
# 2026-09-16 it is a job with no interpreter.
#
# There is deliberately no dependabot/renovate config: `main` is unprotected
# here, so an unattended bot opening PRs against it is a larger decision than
# this file should make on its own. That leaves bumping manual and therefore
# easy to forget — a pinned-but-stale action is the accepted trade against a
# mutable-tag supply chain, and the follow-on is tracked in
# memory/tasks.d/2026-07-30-fix-cite-trunk-ladder-once.md.

# Deliberately NOT path-filtered. A filter buys nothing here (the check
# takes seconds) and costs correctness twice: a PR that moves agent
# definitions outside the filtered paths shows no check at all — which reads
# as "nothing to review", not as a failure — and a path-filtered required
# check can never be satisfied on the PRs it skips.
on:
  pull_request:
  push:
    branches: [main]

# The `check` job inherits this and needs nothing more. `actions: read` is
# granted at JOB scope in `sweep-freshness` instead of here — see that job for
# why a credential must not share a job with PR-authored scripts.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Both checks finish in seconds. The bound exists because this job reads
    # files reachable from an untrusted PR branch, and the default is 360
    # minutes: a read that blocks (a symlinked device or FIFO — see leg 4's
    # root loop) would otherwise hold a runner for six hours per push. The
    # script excludes non-regular files by construction; this is the backstop
    # for the case that guard is ever weakened.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Policy check first, controls second with `if: always()`. Both always
      # run, so neither hides the other. Controls-first was tried and inverted
      # the diagnostic on the common case: the controls build a fixture from
      # the tree, so a genuinely unpinned dispatch in a PR trips their BASELINE
      # gate, and the red step is then named after the harness while the step
      # named after the policy is skipped entirely. See `cepa:autonomy` §9f.
      - name: Check model pins
        run: bash scripts/check-model-pins.sh
      - name: Check model-pin checker controls
        if: always()
        run: bash scripts/check-model-pins-controls.sh

  # Detects GitHub's SILENT 60-day disable of `schedule:` workflows, which
  # would otherwise stop the mutation sweep with no run, no notification and
  # no failed check anywhere. What this detector is for, why it is
  # push-triggered rather than a second scheduled job, why it warns instead of
  # failing, and how its `UNVERIFIED` differs from §9's evidence-field
  # `UNVERIFIED` are all `cepa:autonomy` §9f — read them there.
  #
  # ITS OWN JOB, and that is a security boundary, not tidiness. The `check`
  # job runs `bash scripts/*.sh` FROM THE PR HEAD — attacker-authored on a
  # fork PR. A step in that job holding `GH_TOKEN` is reachable by an earlier
  # step: `$GITHUB_PATH` is written by one step and prepended to `PATH` for
  # every later step in the SAME job, so a PR that appends a `gh` shim to it
  # receives the token in that shim's environment. The exposure is bounded
  # today (a fork `pull_request` token is read-only regardless of the
  # `permissions:` block), but the bound is GitHub's, not ours, and a later
  # widening — or a switch to `pull_request_target` — would land on a design
  # that had assumed the question settled. A separate job shares no PATH, no
  # filesystem, and no checkout: it needs none of the repo, only the API.
  #
  # The one implementation rule that belongs at this site rather than in §9f:
  # every failure path below exits 0 explicitly AFTER emitting a warning.
  # There is deliberately no silent fall-through — a detector that cannot tell
  # "fresh" from "did not parse" is the exact defect it exists to catch, and
  # this one shipped with that path before review reproduced it.
  sweep-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Read-only workflow-run metadata, and nothing else — no `contents`,
      # because this job never checks the repo out.
      actions: read
    steps:
      - name: Mutation sweep freshness
        env:
          GH_TOKEN: ${{ github.token }}
          # Two missed weekly cycles plus slack. Tight enough that a disable is
          # noticed inside a fortnight, loose enough that one skipped run is not
          # a warning.
          STALE_AFTER_DAYS: 16
        run: |
          set -o pipefail
          # `status=success`, not merely the newest run. A sweep that fails its
          # classifier selftest, or is CANCELLED by timeout-minutes — the
          # outcome mutation-sweep.yml calls the one most worth knowing about —
          # still creates a run record and still refreshes `created_at`. Keying
          # on the newest run of ANY conclusion would print "last ran 2 days
          # ago" on every PR while the sweep had verified nothing for months:
          # a freshness detector reporting liveness instead of evidence.
          #
          # stderr to a file, not 2>&1: on a 404 `gh` writes the API's JSON
          # body to STDOUT, so merging them put a raw blob inside the warning
          # annotation. Observed on the first hosted run of this step.
          if ! out=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/mutation-sweep.yml/runs?status=success&per_page=1" \
                --jq '.workflow_runs[0].created_at // ""' 2>"$RUNNER_TEMP/gh.err"); then
            reason=$(head -c 300 "$RUNNER_TEMP/gh.err" | head -1)
            # This branch is entered on ANY gh failure — 404, 403, rate limit,
            # network, missing binary — so it leads with the actual stderr and
            # offers the 404 reading as the likeliest, never as the diagnosis.
            printf '::warning::mutation sweep freshness UNVERIFIED: %s. If that is a 404, no workflow of that name is registered — expected until it reaches the default branch, and a rename or a deletion after that\n' \
              "${reason:-no reason reported}"
            exit 0
          fi
          if [ -z "$out" ]; then
            printf '::warning::the mutation sweep has no SUCCESSFUL run on record — it has either never run, or never passed. Dispatch it once; that also calibrates its timeout-minutes, which is still an unmeasured 3x of a local figure\n'
            exit 0
          fi
          # Parsed into a variable and gated, NOT inlined into the arithmetic.
          # Inlined, an unparseable timestamp leaves `age` empty, `[ "" -gt N ]`
          # errors, an `if` reads that error as false, and control falls to the
          # reassuring else-branch: no annotation, exit 0, "last ran  days ago"
          # with a blank number. `set -e` does not abort on an arithmetic error
          # inside an assignment, so nothing else catches it either. Reproduced
          # under GitHub's own `bash -e` shell before this guard existed.
          if ! ts=$(date -u -d "$out" +%s 2>/dev/null) || [ -z "$ts" ]; then
            printf '::warning::mutation sweep freshness UNVERIFIED: could not parse the run timestamp %s\n' "$out"
            exit 0
          fi
          age=$(( ( $(date -u +%s) - ts ) / 86400 ))
          if [ "$age" -gt "$STALE_AFTER_DAYS" ]; then
            printf '::warning::the last SUCCESSFUL mutation sweep was %s days ago (%s), past its %s-day bound. A weekly schedule that stops producing passing runs is what a 60-day inactivity disable looks like — re-enable it in the Actions tab, or dispatch it\n' \
              "$age" "$out" "$STALE_AFTER_DAYS"
          else
            printf 'last successful mutation sweep: %s days ago (%s)\n' "$age" "$out"
          fi
