name: model-pins

# Enforces the "every dispatch declares its model" rule in CLAUDE.md.
# Without a runner, that rule is prose-only compliance — which is the exact
# failure mode documented in
# docs/solutions/logic-errors/unpinned-subagent-dispatches-inherit-the-session-model.md
#
# The check is read-only and takes seconds. Its pass condition is defined by
# `cepa:autonomy` §9f — read it there rather than inferring it from this
# comment or from any one leg's output verb.
#
# Security: this workflow interpolates NO event data (no ${{ github.event.* }})
# into any run: step, so there is no injection surface. Keep it that way — if
# a future step needs event data, pass it through env: with quoting.
#
# Action pinning: every third-party action is pinned to a FULL 40-char commit
# SHA with a trailing `# vX.Y.Z` naming the tag that SHA was resolved from. A
# version tag is mutable — `v4` is repointed by its publisher — so a tag pin
# grants every future publisher push write access to this job.
#
# To bump: re-resolve the SHA from upstream and replace BOTH the SHA and the
# comment together —
#
#     gh api repos/actions/checkout/git/refs/tags/v4.5.0 --jq .object.sha
#
# Never edit the comment alone (it then lies about which commit runs), and
# never restore a bare tag. There is deliberately no dependabot/renovate
# config: `main` is unprotected here, so an unattended bot opening PRs against
# it is a larger decision than this file should make on its own. That leaves
# bumping manual and therefore easy to forget — a pinned-but-stale action is
# the accepted trade against a mutable-tag supply chain, and the follow-on is
# tracked in memory/tasks.d/2026-07-30-fix-cite-trunk-ladder-once.md.

# Deliberately NOT path-filtered. A filter buys nothing here (the check
# takes seconds) and costs correctness twice: a PR that moves agent
# definitions outside the filtered paths shows no check at all — which reads
# as "nothing to review", not as a failure — and a path-filtered required
# check can never be satisfied on the PRs it skips.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # For the freshness step only, which reads this repo's own workflow-run
  # history. Run metadata is not a secret — it is visible to anyone who can
  # read the repo — so granting it on `pull_request` (where a fork gets a
  # read-only token) widens nothing that matters. Nothing here writes, and the
  # step interpolates no event data: the token arrives through `env:` and
  # `$GITHUB_REPOSITORY` is runner environment, not an expression.
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Both checks finish in seconds. The bound exists because this job reads
    # files reachable from an untrusted PR branch, and the default is 360
    # minutes: a read that blocks (a symlinked device or FIFO — see leg 4's
    # root loop) would otherwise hold a runner for six hours per push. The
    # script excludes non-regular files by construction; this is the backstop
    # for the case that guard is ever weakened.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Policy check first, controls second with `if: always()`. Both always
      # run, so neither hides the other. Controls-first was tried and inverted
      # the diagnostic on the common case: the controls build a fixture from
      # the tree, so a genuinely unpinned dispatch in a PR trips their BASELINE
      # gate, and the red step is then named after the harness while the step
      # named after the policy is skipped entirely. See `cepa:autonomy` §9f.
      - name: Check model pins
        run: bash scripts/check-model-pins.sh
      - name: Check model-pin checker controls
        if: always()
        run: bash scripts/check-model-pins-controls.sh

      # GitHub disables a `schedule:` workflow after 60 days of repository
      # inactivity. The disable is SILENT: no run, no notification, no failed
      # check. The mutation sweep simply stops, its evidence ages out, and
      # every green run of the two steps above keeps reporting that the
      # controls are covered — which is the one-layer-up version of exactly
      # what the sweep exists to catch. So it gets a detector rather than a
      # comment asking a human to notice an absence.
      #
      # It lives HERE, on push/pull_request, and NOT in a second scheduled
      # workflow: a scheduled heartbeat shares the failure mode it would be
      # watching for — the same 60-day rule disables both, and the detector
      # goes quiet together with the thing it detects. A push-triggered check
      # cannot fire during the silence, and that limit is the honest one: it
      # reports at the next push, which is the first moment anyone is present
      # to act on it.
      #
      # WARNS, never fails. Sweep freshness is not a property of the PR being
      # reviewed, and failing unrelated PRs is how a signal gets routed around.
      # A rename of the sweep workflow lands in the unverified branch below, so
      # it surfaces as a warning rather than as a quiet pass. The sweep's
      # cadence and why it is not a PR gate are `cepa:autonomy` §9f.
      - name: Mutation sweep freshness
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Two missed weekly cycles plus slack. Tight enough that a disable is
          # noticed inside a fortnight, loose enough that one skipped run is not
          # a warning.
          STALE_AFTER_DAYS: 16
        run: |
          set -o pipefail
          if ! out=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/mutation-sweep.yml/runs?per_page=1" \
                --jq '.workflow_runs[0].created_at // ""' 2>&1); then
            printf '::warning::mutation sweep freshness UNVERIFIED (%s) — a renamed or deleted sweep workflow reaches this branch too\n' "$out"
            exit 0
          fi
          if [ -z "$out" ]; then
            printf '::warning::the mutation sweep has never produced a run. Dispatch it once — that also calibrates its timeout-minutes, which is still an unmeasured 3x of a local figure\n'
            exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$out" +%s) ) / 86400 ))
          if [ "$age" -gt "$STALE_AFTER_DAYS" ]; then
            printf '::warning::the mutation sweep last ran %s days ago (%s), past its %s-day bound. A weekly schedule that stops producing runs is what a 60-day inactivity disable looks like — re-enable it in the Actions tab, or dispatch it\n' \
              "$age" "$out" "$STALE_AFTER_DAYS"
          else
            printf 'mutation sweep last ran %s days ago (%s)\n' "$age" "$out"
          fi
